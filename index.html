<script>
const R=d=>d*Math.PI/180, D=r=>r*180/Math.PI, lerp=(a,b,t)=>a+(b-a)*t, cl=(v,a,b)=>Math.max(a,Math.min(b,v));

function ik(H,A,L1,L2,up){ const dx=A[0]-H[0],dy=A[1]-H[1],d=Math.min(Math.hypot(dx,dy),L1+L2-0.01),a=Math.acos(cl((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1)),b=Math.atan2(dy,dx); return pol(H,L1,b+(up?-a:a)); }
function ik2(H,A,L1,L2,pick){ const a=ik(H,A,L1,L2,true),b=ik(H,A,L1,L2,false); return pick(a,b)?a:b; }
function elbow(S,Hd,L1,L2,H){ const a=ik(S,Hd,L1,L2,true), b=ik(S,Hd,L1,L2,false), c=E=>(E[0]-S[0])*(Hd[1]-E[1])-(E[1]-S[1])*(Hd[0]-E[0]); return c(a)<=c(b)?a:b; }
function knee(H,A,L1,L2,ant){ const a=ik(H,A,L1,L2,true), b=ik(H,A,L1,L2,false), c=K=>(K[0]-H[0])*(A[1]-K[1])-(K[1]-H[1])*(A[0]-K[0]); return c(a)>=c(b)?a:b; }
const ang3=(a,b,c)=>{ const v1=[a[0]-b[0],a[1]-b[1]],v2=[c[0]-b[0],c[1]-b[1]]; return D(Math.acos(cl((v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(...v1)*Math.hypot(...v2)),-1,1))); };

  tip(g){ const k=g.knee; return k<77?["warn","Стопи надто близько — коліна зігнуті сильніше 90°, вмикається квадрицепс."]:k<=104?["good","Кут у колінах близько 90° — максимум навантаження на сідниці ✓"]:["warn","Стопи далеко — ноги випрямлені, навантаження переходить на біцепс стегна."]; },
  muscles:[["glu","H","K",0.02,-16,22,15],["ham","H","K",0.55,-11,30,9],["quad","H","K",0.5,12,32,10]],
  equip(g){ return '<rect x="56" y="157" width="74" height="14" rx="5" fill="#3A4252"/><rect x="86" y="171" width="14" height="78" fill="#2C3340"/><rect x="62" y="248" width="62" height="7" rx="3" fill="#2C3340"/>'; },

  muscles:[["quad","H","K",0.55,11,32,10],["ham","H","K",0.5,-11,28,8],["glu","H","K",0.0,-12,19,14],["back","H","S",0.25,11,22,7]],

  geo(t,p){ const A=[200,GROUND-6], toe=[A[0]+26,GROUND], k=lerp(6,42,t);

  muscles:[["ham","H","K",0.5,-11,30,9],["glu","H","K",0.0,-12,19,14],["quad","H","K",0.5,11,28,8],["back","H","S",0.25,11,22,7]],

 lunge:{name:"Випади",l0:"Короткий крок",l1:"Довгий крок",lv:t=>"довжина кроку "+Math.round(lerp(55,95,t))+" см",

  load(g){ const s=g.shin; return {quad:0.15+0.9*cl((s+2)/30,0,1),glu:0.25+0.75*cl((18-s)/22,0,1),ham:0.1+0.25*cl((14-s)/20,0,1)}; },

  geo(t,p){ const a=R(lerp(0,80,t)), u=[-Math.cos(a),-Math.sin(a)], n=[-Math.sin(a),Math.cos(a)], H=[214,196];
